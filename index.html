<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>民意信箱分案工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* 版面概念：公文收發的流程簽——上方一條六站的流程軌，下方是當站的公文夾（指標、閘門、清單），點案號展開「案件履歷」側欄 */
:root{
  --paper:#f4f6f9; --surface:#ffffff; --sunken:#eef1f6; --ink:#16202e; --muted:#5a6678; --faint:#8a95a6; --line:#dbe1ea;
  --accent:#23486f; --accent-ink:#ffffff; --accent-soft:#e3ebf5;
  --seal:#b3302a; --seal-soft:#f8e5e3; --warn:#9a6200; --warn-soft:#fbefd9; --ok:#2d7650; --ok-soft:#e2f2e8; --info:#3c5f8a;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 8px 24px rgba(22,32,46,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e131a; --surface:#151c26; --sunken:#111821; --ink:#e5eaf1; --muted:#9aa6b7; --faint:#6f7b8c; --line:#253041;
  --accent:#8db2de; --accent-ink:#0e131a; --accent-soft:#1b2a3c;
  --seal:#ea7468; --seal-soft:#3a1d1b; --warn:#e3a947; --warn-soft:#3a2b12; --ok:#62c48d; --ok-soft:#14301f; --info:#8db2de;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e131a; --surface:#151c26; --sunken:#111821; --ink:#e5eaf1; --muted:#9aa6b7; --faint:#6f7b8c; --line:#253041;
  --accent:#8db2de; --accent-ink:#0e131a; --accent-soft:#1b2a3c;
  --seal:#ea7468; --seal-soft:#3a1d1b; --warn:#e3a947; --warn-soft:#3a2b12; --ok:#62c48d; --ok-soft:#14301f; --info:#8db2de;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}

/* 頁首 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal-mark{width:38px;height:38px;border:2px solid var(--seal);color:var(--seal);border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:15px;line-height:1;letter-spacing:.02em;transform:rotate(-4deg);flex:none}
.brand h1{font-family:var(--f-disp);font-weight:900;font-size:20px;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunken);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.sim{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--seal-soft);color:var(--seal);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--accent-soft);color:var(--info);border-color:transparent}

/* 流程軌 */
.rail{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;padding-block:16px 4px;overflow-x:auto;scrollbar-width:thin}
.station{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px;cursor:pointer;display:grid;gap:6px;min-width:150px;transition:border-color .15s,box-shadow .15s}
.station:hover{border-color:var(--accent)}
.station[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow)}
.station .code{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.station .name{font-weight:700;font-size:15px}
.station .skill{font-family:var(--f-mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.station .flow{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.station .flow b{font-size:20px;color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.station[data-state="done"] .dot{background:var(--ok)}
.station[data-state="warn"] .dot{background:var(--warn)}
.station[data-state="run"] .dot{background:var(--accent);animation:pulse 1s infinite}
.station[data-state="block"] .dot{background:var(--seal)}
@keyframes pulse{50%{opacity:.3}}
.station .bar{height:3px;border-radius:3px;background:var(--sunken);overflow:hidden}
.station .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s ease}
.station[data-state="done"] .bar i,.station[data-state="warn"] .bar i{width:100%}
.station[data-state="done"] .bar i{background:var(--ok)}
.station[data-state="warn"] .bar i{background:var(--warn)}

/* 主區 */
main{padding-block:16px 48px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2,.panel-h h3{margin:0;font-size:15px;font-weight:700}
.panel-b{padding:14px 16px;display:grid;gap:14px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:grid;gap:16px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.field select,.field input[type=text],.field input[type=datetime-local],.field textarea{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:7px 10px;min-width:0}
.field textarea{min-height:88px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;display:grid;gap:4px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop strong{color:var(--ink)}
.toggle{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:4px 0}
.toggle input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.toggle span{display:grid;line-height:1.45}
.toggle small{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--faint)}
details.fold[open]>summary::after{content:"－"}
.map-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.map-grid select{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:4px 6px;min-width:0;width:100%}

/* 站內容 */
.stage-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stage-head .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--faint);letter-spacing:.08em}
.stage-head h2{font-family:var(--f-disp);font-size:24px;font-weight:900;margin:2px 0 4px;letter-spacing:.03em;text-wrap:balance}
.stage-head p{margin:0;color:var(--muted);max-width:68ch}
.stage-head .io{margin-left:auto;display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:220px;max-width:340px}
.stage-head .io div{display:grid;grid-template-columns:3.2em 1fr;gap:6px}
.stage-head .io b{color:var(--ink);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 18px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--seal)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.gates{padding:14px 20px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.gate{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px}
.gate .chip{margin-top:1px}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 20px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:6px 10px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tablebox{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--sunken);text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.03em;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--accent-soft)}
td .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:46ch}
td.num{text-align:right;font-family:var(--f-mono)}
.caseid{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.urg{border-left:3px solid var(--seal)}
.tok{font-family:var(--f-mono);font-size:.92em;background:var(--accent-soft);color:var(--info);border-radius:4px;padding:0 4px;white-space:nowrap}
.ph{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px}
.src{color:var(--faint);font-size:.88em}
.more{padding:10px 20px;color:var(--muted);font-size:12px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{margin:0;color:var(--ink);font-family:var(--f-disp);font-size:20px}

/* 印章 */
.stamp{display:inline-grid;place-items:center;border:1.5px solid currentColor;border-radius:4px;padding:0 6px;font-family:var(--f-disp);font-weight:900;font-size:12px;letter-spacing:.08em;line-height:1.6;transform:rotate(-3deg);white-space:nowrap}
.stamp.red{color:var(--seal)} .stamp.amber{color:var(--warn)} .stamp.blue{color:var(--info)} .stamp.green{color:var(--ok)}

/* 案件履歷側欄 */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--surface);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
aside.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-h h3{margin:0;font-family:var(--f-mono);font-size:18px}
.dr-b{overflow-y:auto;padding:16px 20px 32px;display:grid;gap:4px}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;left:21px;top:30px;bottom:0;width:1.5px;background:var(--line)}
.step:last-child::before{display:none}
.step .n{width:44px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--info);font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.step h4{margin:3px 0 8px;font-size:14px}
.box{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.kv{display:grid;grid-template-columns:7em minmax(0,1fr);gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.cands{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.cand .r{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
.cand small{color:var(--muted);display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tabs button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:500}
.draft{position:relative}
.draft .wm{position:absolute;right:10px;top:8px}
.copy{margin-top:6px}

/* 提示 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);font-size:13px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:12px}
.privacy svg{width:16px;height:16px;flex:none;margin-top:2px}
.sugg{display:grid;gap:10px;padding:14px 20px}
.sug{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.sug-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sug-h b{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.sug p{margin:0;font-size:13px}
.sug .ev{color:var(--muted)}
.unitbars{padding:6px 20px 16px;display:grid;gap:8px}
.ub{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 5em;gap:10px;align-items:center;font-size:13px}
.ub .t{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.ub .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.ub .t i.low{background:var(--warn)}
.ub span:last-child{font-family:var(--f-mono);text-align:right}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static;order:2}}
@media (max-width:640px){.rail{grid-template-columns:repeat(6,minmax(140px,1fr))}.stage-head .io{margin-left:0;min-width:0;max-width:none}.brand small{display:none}.kpi .v{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="seal-mark" aria-hidden="true">分案</div>
        <div><h1>民意信箱分案工作台</h1><small>A1 去識別化 → A2 理解 → A3 分案 → A4/A5 擬稿 → A6 SLA → A7 月報</small></div>
      </div>
      <span class="chip sim" id="dataChip">範例資料</span>
      <div class="top-actions">
        <button class="btn" id="btnExport" type="button" title="匯出所有階段結果為 Excel 檔"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>匯出 Excel</button>
        <button class="btn primary" id="btnRun" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>執行全流程</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="rail" id="rail" role="tablist" aria-label="流程階段"></nav>
</div>

<main class="wrap">
  <div class="layout">
    <div class="side">
      <section class="panel" aria-labelledby="h-data">
        <div class="panel-h"><h2 id="h-data">案件來源</h2><span class="chip" id="rowCount">0 件</span></div>
        <div class="panel-b">
          <label class="drop" id="drop" for="fileIn">
            <strong>拖放或選擇檔案</strong>
            <span class="note">CSV、XLSX，第一列為欄位名稱</span>
          </label>
          <input type="file" id="fileIn" accept=".csv,.xlsx,.xls,.txt" hidden>
          <button class="btn" id="btnSample" type="button">重新載入範例資料（104 件）</button>
          <details class="fold" id="mapFold">
            <summary>欄位對應</summary>
            <div class="map-grid" id="mapGrid" style="margin-top:10px"></div>
          </details>
          <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>所有運算都在這個瀏覽器分頁內完成，案件內容不會上傳或送給任何服務。真實案件仍應依機關規定在地端處理。</span></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="h-cfg">
        <div class="panel-h"><h2 id="h-cfg">執行參數</h2></div>

function setData(rows, label, isSample){
  S.raw = rows.filter(r => Object.values(r).some(v => String(v ?? "").trim() !== ""));
  S.cols = [...new Set(S.raw.flatMap(r => Object.keys(r)))];
  S.map = autoMap(S.cols); S.dataLabel = label; S.isSample = isSample; S.res = null; S.states = {};
  $("#dataChip").textContent = label; $("#dataChip").className = "chip " + (isSample ? "sim" : "info");
  $("#rowCount").textContent = `${S.raw.length} 件`;
  renderMap(); renderRail(); renderStage();
}
function renderMap(){
  const opt = v => `<option value="">（不使用）</option>` + S.cols.map(c => `<option${c === v ? " selected" : ""}>${esc(c)}</option>`).join("");
  $("#mapGrid").innerHTML = MAP_FIELDS.map(([k, l]) => `<label for="map-${k}">${l}</label><select id="map-${k}" data-k="${k}">${opt(S.map[k])}</select>`).join("");

function loadSample(){ const d = JSON.parse($("#sample").textContent); setData(d.cases, "範例資料（模擬）", true); }
async function loadFile(file){
  try {
    if (/\.(xlsx|xls)$/i.test(file.name)){
      if (!window.XLSX) throw new Error("試算表元件沒有載入，請改用 CSV");
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
      setData(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: true }), file.name, false);
    } else {
      const text = await file.text();
      setData(parseCSV(text), file.name, false);
    }
    toast(`已載入 ${S.raw.length} 件，請確認欄位對應後執行`);
  } catch (e){ toast("無法讀取檔案：" + e.message); }
}
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ","){ row.push(f); f = ""; } else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; } else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const h = rows.shift() || [];
  return rows.map(r => Object.fromEntries(h.map((k, i) => [k.trim(), r[i] ?? ""])));
}

async function doExport(){
  if (!S.res || !S.res.a7){ toast("請先執行全流程"); return; }

$("#scrim").addEventListener("click", closeCase); $("#drClose").addEventListener("click", closeCase);
const drop = $("#drop");
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("#fileIn").click(); } });
drop.tabIndex = 0;

syncCfgUI(); loadSample(); runAll();
